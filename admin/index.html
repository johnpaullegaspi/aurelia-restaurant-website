<body>
  <!-- Decap CMS reads admin/config.yml automatically and renders the whole
       editing UI into this page — nothing else to build here.

       Two things matter about the script tag below, both confirmed live
       against this exact site — get either one wrong and this page loads
       blank with "Uncaught TypeError: Cannot read properties of null
       (reading 'appendChild')" in the console:

       1. It must be at the END of <body>, not in <head>. Decap CMS builds
          its own root container with document.body.appendChild() the
          instant the script runs, no "wait for the page" guard. A script
          in <head> with no defer/async executes before <body> exists yet,
          so document.body is null and it throws immediately.

       2. It must be an EXACT version, not a "^range". unpkg resolves a
          range like "decap-cms@^3.8.3" to whatever the newest matching
          release happens to be at the moment someone's browser loads this
          page — and the newest release can (and did) ship with an internal
          decap-cms-app/decap-cms-core version mismatch that crashes on
          init with no config-side fix possible. 3.14.0 is confirmed
          working. It must stay >= 3.8.3 for DecapBridge's SSO login
          options (see DEPLOYMENT.md). To upgrade later, open the new
          version's URL directly in a browser tab first and confirm it
          logs its version numbers with no error before changing the pin
          here — never switch this back to a ^range. -->
  <script src="https://unpkg.com/decap-cms@3.14.0/dist/decap-cms.js"></script>
</body>
</html>
